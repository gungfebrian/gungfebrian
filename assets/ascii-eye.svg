  <text x="20" y="97" xml:space="preserve">             , &#x27;   _ . - ~ - . _   &#x27; ,             </text>
  <text x="20" y="116" xml:space="preserve">          , &#x27;   . &#x27;             &#x27; .   &#x27; ,          </text>
