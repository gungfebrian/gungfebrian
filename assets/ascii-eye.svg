<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 264" width="800" height="264" role="img" aria-label="Gung Febrian — Computer Engineering at ITS animated ASCII eye banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1018"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="798" height="262" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
    }
    .title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 19px;
      font-weight: 700;
      fill: #F8FAFC;
      letter-spacing: 2px;
    }
    .hdr {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      fill: #64748B;
    }
    .meta-key {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      fill: #38BDF8;
      font-weight: 600;
    }
    .meta-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      fill: #CBD5E1;
    }
    .meta-dim {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      fill: #94A3B8;
    }
    .sclera { fill: #94A3B8; }
    .iris { fill: #38BDF8; }
    .blink-dot {
      fill: #10B981;
      animation: pulse 2s ease-in-out infinite;
    }
    .scanline {
      animation: scan 6.4s linear infinite;
    }

    .f-center { animation: showCenter 6.4s step-end infinite; }
    .f-right  { animation: showRight  6.4s step-end infinite; opacity: 0; }
    .f-left   { animation: showLeft   6.4s step-end infinite; opacity: 0; }
    .f-half   { animation: showHalf   6.4s step-end infinite; opacity: 0; }
    .f-closed { animation: showClosed 6.4s step-end infinite; opacity: 0; }

    @keyframes showCenter {
      0%   { opacity: 1; }
      24%  { opacity: 0; }
      44%  { opacity: 1; }
      58%  { opacity: 0; }
      78%  { opacity: 1; }
      90%  { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes showRight {
      0%   { opacity: 0; }
      24%  { opacity: 1; }
      44%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes showLeft {
      0%   { opacity: 0; }
      58%  { opacity: 1; }
      78%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes showHalf {
      0%   { opacity: 0; }
      90%  { opacity: 1; }
      93%  { opacity: 0; }
      97%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes showClosed {
      0%   { opacity: 0; }
      93%  { opacity: 1; }
      97%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes scan {
      0%   { transform: translateY(34px); }
      100% { transform: translateY(264px); }
    }
  </style>

  <!-- Card background -->
  <rect x="1" y="1" width="798" height="262" rx="14" ry="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle animated scanline -->
  <g clip-path="url(#cardClip)">
    <rect class="scanline" x="0" y="0" width="800" height="30" fill="url(#scanGrad)"/>
  </g>

  <!-- Terminal top chrome -->
  <rect x="1" y="1" width="798" height="34" rx="14" ry="14" fill="#161B22" clip-path="url(#cardClip)"/>
  <line x1="1" y1="35" x2="799" y2="35" stroke="#1E293B" stroke-width="1"/>
  <circle cx="22" cy="18" r="5" fill="#EF4444" opacity="0.85"/>
  <circle cx="38" cy="18" r="5" fill="#F59E0B" opacity="0.85"/>
  <circle cx="54" cy="18" r="5" fill="#10B981" opacity="0.85"/>
  <text x="74" y="22" class="hdr">gung@its-ce:~  —  optical_monitor.cpp</text>
  <text x="778" y="22" text-anchor="end" class="hdr">60Hz · ACTIVE</text>

