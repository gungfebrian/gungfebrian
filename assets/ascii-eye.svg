  <!-- Vertical divider -->
  <line x1="384" y1="54" x2="384" y2="240" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right identity readout -->
  <g transform="translate(412, 80)">
    <text x="0" y="0" class="title">GUNG FEBRIAN</text>
    <text x="0" y="20" class="meta-dim">Computer Engineering · ITS Surabaya</text>
    <line x1="0" y1="34" x2="362" y2="34" stroke="#1E293B" stroke-width="1"/>

    <text x="0" y="60" class="meta-key">CORE</text>
    <text x="68" y="60" class="meta-val">C++ · Embedded · IoT · Robotics</text>

    <text x="0" y="84" class="meta-key">APPLE</text>
    <text x="68" y="84" class="meta-val">Swift · SwiftUI · CoreML · BLE</text>

    <text x="0" y="108" class="meta-key">SYSTEMS</text>
    <text x="68" y="108" class="meta-val">Go · Python · Linux · APIs</text>

    <line x1="0" y1="126" x2="362" y2="126" stroke="#1E293B" stroke-width="1"/>

    <circle cx="6" cy="148" r="4.5" class="blink-dot"/>
    <text x="20" y="152" class="meta-val">Building close to hardware &amp; sensors</text>
